<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TiempoBiblia.Client</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TiempoBiblia.Client.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
        window.descargarBlobSeguro = (byteBase64, nombreArchivo, mimeType) => {
            try {
                // Convertimos el base64 a un array de bytes
                const byteCharacters = atob(byteBase64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);

                // Creamos el Blob nativo en la memoria del celular
                const blob = new Blob([byteArray], { type: mimeType || 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);

                // Creamos un enlace invisible para simular el clic nativo
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = nombreArchivo;
                document.body.appendChild(a);
                a.click();

                // Limpiamos la memoria
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 100);
            } catch (e) {
                console.error("Error al procesar la descarga nativa:", e);
                alert("Tu celular bloqueó la descarga automática. Por favor abre este enlace en Chrome o Safari.");
            }
        };
    </script>
</body>

</html>
