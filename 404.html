    <script>
        window.descargarBlobSeguro = (byteBase64, nombreArchivo, mimeType) => {
            try {
                // Convertimos el base64 a un array de bytes
                const byteCharacters = atob(byteBase64);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);

                // Creamos el Blob nativo en la memoria del celular
                const blob = new Blob([byteArray], { type: mimeType || 'application/pdf' });
                const blobUrl = URL.createObjectURL(blob);

                // Creamos un enlace invisible para simular el clic nativo
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = nombreArchivo;
                document.body.appendChild(a);
                a.click();

                // Limpiamos la memoria
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);
                }, 100);
            } catch (e) {
                console.error("Error al procesar la descarga nativa:", e);
                alert("Tu celular bloqueó la descarga automática. Por favor abre este enlace en Chrome o Safari.");
            }
        };
    </script>
    <!-- SDK de Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>

    <!-- Nuestro ayudante para dibujar el Brick en Blazor -->
    <script>
        let cardPaymentBrickController;

        window.renderMercadoPagoBrick = async (publicKey, amount, dotNetHelper) => {
            // Inicializamos Mercado Pago con tu llave pública
            const mp = new MercadoPago(publicKey, { locale: 'es-CO' });
            const bricksBuilder = mp.bricks();

            // Si ya había un formulario dibujado, lo borramos para no duplicar
            if (cardPaymentBrickController) cardPaymentBrickController.unmount();

            const settings = {
                initialization: {
                    amount: amount, // El total del carrito que manda C#
                },
                customization: {
                    visual: { style: { theme: 'default' } },
                    paymentMethods: {
                        bankTransfer: "all",  // 🔥 Habilita PSE (Se aprueba de inmediato)
                        creditCard: "all",    // 🔥 Tarjetas de Crédito
                        debitCard: "all",     // 🔥 Tarjetas de Débito
                        mercadoPago: "all"    // 🔥 Saldo en cuenta de Mercado Pago
                    }
                },
                callbacks: {
                    onReady: () => { console.log("¡Formulario de tarjeta listo!"); },
                    onSubmit: (formData) => {
                        return new Promise((resolve, reject) => {
                            // Recibimos un true o false desde C#
                            dotNetHelper.invokeMethodAsync('ProcesarPago', formData)
                                .then((pagoExitoso) => {
                                    if (pagoExitoso) {
                                        resolve(); // Todo bien, el Brick se cierra feliz
                                    } else {
                                        reject(); // Falló, el Brick hace una animación roja y se queda intacto
                                    }
                                })
                                .catch((error) => reject());
                        });
                    },
                    onError: (error) => { console.error(error); }
                }
            };

            // Dibujamos el formulario en el div que pusimos en Carrito.razor
            cardPaymentBrickController = await bricksBuilder.create(
                'payment',
                'paymentBrick_container',
                settings
            );
        };
    </script>
    <script>
        window.renderPayPalButton = function (clientId, dotNetHelper) {

            // Función interna que dibuja los botones una vez que el SDK cargó
            const renderizarBotones = () => {
                const container = document.getElementById('paypal-button-container');
                if (container) container.innerHTML = ''; // Limpiamos por si acaso

                paypal.Buttons({
                    style: { layout: 'vertical', color: 'gold', shape: 'rect', label: 'paypal' },
                    createOrder: function (data, actions) {
                        return dotNetHelper.invokeMethodAsync('CrearOrdenPayPalAPI');
                    },
                    onApprove: function (data, actions) {
                        return dotNetHelper.invokeMethodAsync('CapturarOrdenPayPalAPI', data.orderID);
                    },
                    onCancel: function (data) {
                        dotNetHelper.invokeMethodAsync('CancelarPayPalAPI');
                    },
                    onError: function (err) {
                        dotNetHelper.invokeMethodAsync('ErrorPayPalAPI', err.toString());
                    }
                }).render('#paypal-button-container');
            };

            // 1. Verificamos si PayPal ya se cargó antes para no cargarlo dos veces
            if (window.paypal) {
                renderizarBotones();
                return;
            }

            // 2. Si no existe, creamos la etiqueta <script> dinámicamente usando tu Client ID
            const script = document.createElement('script');
            script.src = `https://www.paypal.com/sdk/js?client-id=${clientId}&currency=USD`;
            script.onload = renderizarBotones; // Cuando termine de cargar, dibuja los botones
            document.head.appendChild(script); // Lo inyectamos en la página
        };
    </script>
